[pytest]
addopts = 
    --cov=prometheus_swarm 
    --cov-report=xml 
    --cov-report=term 
    --cov-report=html:coverage-report 
    --cov-config=.coveragerc
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers = 
    unit: marks unit tests
    integration: marks integration tests